name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'These Go files need gofmt:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Run Go tests
        run: go test -race -count=1 ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Run browser JavaScript tests
        run: |
          shopt -s nullglob
          tests=(internal/webui/*.test.cjs)
          if [ ${#tests[@]} -gt 0 ]; then
            node --test "${tests[@]}"
          fi

      - name: Run ForwardWidget backtest
        run: |
          if [ -f test-forward-widget.js ]; then
            node test-forward-widget.js
          fi

      - name: Build application
        run: CGO_ENABLED=0 go build -trimpath -o dist/juku .

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: juku-linux-amd64
          path: dist/juku
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Docker smoke test
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag guoguo-juku:ci .

      - name: Start container
        run: |
          docker run --detach --name guoguo-juku-ci \
            --env JUKU_ADMIN_USER=admin \
            --env JUKU_ADMIN_PASSWORD=ci-only-password \
            --publish 127.0.0.1:8999:8999 \
            guoguo-juku:ci

      - name: Wait for health check
        run: |
          for attempt in $(seq 1 40); do
            status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' guoguo-juku-ci)"
            if [ "$status" = healthy ]; then
              exit 0
            fi
            if [ "$status" = unhealthy ]; then
              docker logs guoguo-juku-ci
              exit 1
            fi
            sleep 3
          done
          docker logs guoguo-juku-ci
          exit 1

      - name: Verify root web UI
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8999/ | grep -q '果果剧库'

      - name: Print container logs on failure
        if: failure()
        run: docker logs guoguo-juku-ci || true

      - name: Stop container
        if: always()
        run: docker rm --force guoguo-juku-ci || true
